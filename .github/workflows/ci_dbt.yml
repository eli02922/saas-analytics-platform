# GitHub Actions CI/CD Workflow for dbt and SQL validation
name: dbt CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'dbt_project/**'
      - 'sql/**'
      - '.github/workflows/ci_dbt.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'dbt_project/**'
      - 'sql/**'

jobs:
  dbt-lint-and-compile:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake dbt-core
          pip install sqlfluff pyyaml
      
      - name: dbt debug
        env:
          DBT_PROFILES_DIR: ~/.dbt
        run: |
          cd dbt_project
          dbt debug --profiles-dir ~/.dbt || echo "Warning: Snowflake connection not available in CI"
      
      - name: dbt parse
        run: |
          cd dbt_project
          dbt parse
      
      - name: dbt compile
        run: |
          cd dbt_project
          dbt compile
      
      - name: SQL Lint (sqlfluff)
        run: |
          sqlfluff lint dbt_project/models/ --dialect snowflake || true
      
      - name: Check dbt lineage
        run: |
          cd dbt_project
          dbt run --models state:new,state:modified --dry-run || true

  dbt-test:
    runs-on: ubuntu-latest
    needs: dbt-lint-and-compile
    
    if: github.event_name == 'pull_request'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake dbt-core
      
      - name: Run dbt tests
        run: |
          cd dbt_project
          dbt test --models state:new,state:modified || true
        continue-on-error: true

  documentation:
    runs-on: ubuntu-latest
    
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake dbt-core
      
      - name: Generate dbt docs
        run: |
          cd dbt_project
          dbt docs generate || true
      
      - name: Upload documentation
        uses: actions/upload-artifact@v3
        with:
          name: dbt-documentation
          path: dbt_project/target/

  notify:
    runs-on: ubuntu-latest
    if: always()
    needs: [dbt-lint-and-compile, dbt-test, documentation]
    
    steps:
      - name: Check workflow status
        run: |
          if [ "${{ job.status }}" == "failure" ]; then
            echo "❌ dbt CI/CD pipeline failed"
            exit 1
          else
            echo "✅ dbt CI/CD pipeline passed"
          fi
