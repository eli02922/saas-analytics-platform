# GitHub Actions CI/CD Workflow for Python code
name: Python CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/ci_python.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'

jobs:
  python-lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black isort flake8 pylint mypy
      
      - name: Run isort (import sorting)
        run: isort src tests --check-only --diff
      
      - name: Run black (code formatting)
        run: black src tests --check
      
      - name: Run flake8 (style checking)
        run: flake8 src tests --max-line-length=100 --ignore=E203,W503
      
      - name: Run pylint
        run: pylint src --fail-under=7.0 || true
      
      - name: Run mypy (type checking)
        run: mypy src --ignore-missing-imports || true

  python-test:
    runs-on: ubuntu-latest
    needs: python-lint
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
      
      - name: Run unit tests
        run: pytest tests/unit -v --cov=src --cov-report=xml
      
      - name: Run integration tests (mocked)
        run: pytest tests/integration -v -m "not requires_snowflake" || true
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
      
      - name: Run bandit (security linting)
        run: bandit -r src -f json -o bandit-report.json || true
      
      - name: Check dependencies for vulnerabilities
        run: safety check --json || true
      
      - name: Upload security report
        uses: actions/upload-artifact@v3
        with:
          name: security-report
          path: bandit-report.json
        continue-on-error: true

  build-python-package:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
      
      - name: Build distribution
        run: |
          python -m pip install .
      
      - name: Verify build
        run: |
          python -c "import saas_analytics; print('✓ Build successful')"
        continue-on-error: true

  notify:
    runs-on: ubuntu-latest
    if: always()
    needs: [python-lint, python-test, security-scan, build-python-package]
    
    steps:
      - name: Check workflow status
        run: |
          if [ "${{ job.status }}" == "failure" ]; then
            echo "❌ Python CI/CD pipeline failed"
            exit 1
          else
            echo "✅ Python CI/CD pipeline passed"
          fi
